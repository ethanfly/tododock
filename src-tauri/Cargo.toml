[package]
name = "tododock"
version = "0.1.9"
description = "A local-first desktop Todo dock"
authors = ["TodoDock contributors"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "tododock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["clock", "serde"] }
log = "0.4.28"
md-5 = "0.10.6"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
ureq = { version = "2.12.1", features = ["json"] }
uuid = { version = "1.26.0", features = ["serde", "v7"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.23.0"
